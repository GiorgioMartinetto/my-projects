app:
  name: "Test App"
  host: "127.0.0.1"
  port: 9000
  version: "2.0.0"
  environment: "prod"
  workers: 4
  debug: true

logging:
  level: "DEBUG"
  json_format: true
  file_enabled: true
  file_path: "logs/test.log"
  rotation: "5 MB"
  retention: "3 days"
  backtrace: false
  diagnose: false
  colorize: true
  enqueue: true
  service_name: "test-service"

database:
  driver: "postgresql"
  host: "db.test.com"
  # port is missing
  name: "testdb"
  user: "testuser"
  password: "testpass"
  pool_size: 10
  max_overflow: 20
  pool_timeout: 60
  pool_recycle: 7200
  pool_pre_ping: true

