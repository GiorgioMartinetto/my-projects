[project]
name = "my-projects"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bcrypt==5.0.0",
    "fastapi==0.135.1",
    "loguru==0.7.3",
    "loguru-mypy==0.0.4",
    "mypy==1.19.1",
    "pre-commit>=4.5.1",
    "psycopg2===2.9.11",
    "pydantic[email]==2.12.5",
    "pysonar>=1.3.0.4086",
    "pytest==9.0.2",
    "pytest-cov==7.0.0",
    "pytest-html==4.2.0",
    "python-dotenv==1.2.2",
    "python-jose>=3.5.0",
    "pyyaml>=6.0.3",
    "ruff==0.15.5",
    "sqlalchemy==2.0.48",
    "types-pyyaml>=6.0.12.20250915",
    "uvicorn==0.41.0",
]

[tool.ruff]
line-length = 88 #lunghezza massima della linea
target-version = "py312" #versione target di Python

[tool.ruff.lint]
select = [
    "E",    # Errori di stile (PEP8)
    "F",    # Errori logici (variabili non usate, import errati)
    "I",    # Import sorting
    "B",    # Bug potenziali (flake8-bugbear)
    "UP",   # Migliorie sintattiche moderne
]
exclude = [
    ".venv",
    "__pycache__"
]

[tool.mypy]
python_version = 3.12
strict = true
ignore_missing_imports = true
warn_return_any = true
disallow_untyped_defs = true
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = "starlette.*"
ignore_missing_imports = true
